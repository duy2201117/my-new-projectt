<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Form HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>FORM THÔNG TIN</h1>
            <form action="#" method="get">
                <div class="form-group">
                    <label for="yourname">Họ và tên:</label>
                    <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
                </div>

                <div class="form-group">
                    <label for="email1">Email:</label>
                    <input type="email" id="email1" name="email" placeholder="Nhập email" required>
                </div>

                <div class="form-group">
                    <label>Sở thích:</label>
                    <div class="options">
                        <label><input type="checkbox" name="hobby" value="thethao"> Thể thao</label>
                        <label><input type="checkbox" name="hobby" value="amnhac"> Âm nhạc</label>
                        <label><input type="checkbox" name="hobby" value="docsach"> Đọc sách</label>
                        <label><input type="checkbox" name="hobby" value="dulich"> Du lịch</label>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">Gửi thông tin</button>
                    <button type="reset" class="reset-btn">Nhập lại</button>
                </div>
            </form>
        </div>

        <div class="form-box">
            <h1>ĐĂNG KÝ HỌC VIÊN</h1>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên" required>
                </div>

                <div class="form-group">
                    <label for="email2">Email:</label>
                    <input type="email" id="email2" name="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
                </div>

                <div class="form-group">
                    <label for="birthday">Ngày sinh:</label>
                    <input type="date" id="birthday" name="birthday" required>
                </div>

                <div class="form-group">
                    <label>Giới tính:</label>
                    <div class="options">
                        <label><input type="radio" name="gender" value="male" required> Nam</label>
                        <label><input type="radio" name="gender" value="female"> Nữ</label>
                        <label><input type="radio" name="gender" value="other"> Khác</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Địa chỉ:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ"></textarea>
                </div>

                <div class="form-group">
                    <label for="course">Khóa học:</label>
                    <select id="course" name="course" required>
                        <option value="">-- Chọn khóa học --</option>
                        <option value="html-css">HTML & CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                        <option value="python">Python</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Hình thức học:</label>
                    <div class="options">
                        <label><input type="radio" name="study_type" value="online" required> Online</label>
                        <label><input type="radio" name="study_type" value="offline"> Offline</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Sở thích:</label>
                    <div class="options">
                        <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
                        <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                        <label><input type="checkbox" name="hobby" value="sport"> Thể thao</label>
                        <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="note">Ghi chú:</label>
                    <textarea id="note" name="note" rows="4" placeholder="Nhập ghi chú..."></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="submit-btn">Đăng ký</button>
                    <button type="reset" class="reset-btn">Nhập lại</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
